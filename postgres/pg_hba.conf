# pg_hba.conf - правила доступа к PostgreSQL Core-системы.
# Подключается в контейнер core-postgres только для чтения
# (см. quadlet/core-postgres.container, параметр hba_file).
# Правила проверяются сверху вниз, срабатывает первое подходящее.
#
# TYPE  DATABASE  USER  ADDRESS  METHOD

# Сокет внутри контейнера: доступен только через podman exec от имени core.
# Нужен для резервных копий и администрирования.
local   all       all            trust

# Любое сетевое подключение, включая localhost, - только по паролю.
host    all       all   all      scram-sha-256
